name: Feature request
description: Suggest an idea or improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Frame-Relay. Tell us what you need and why.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Frame-Relay to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
    validations:
      required: false
  - type: input
    id: ai-agent
    attributes:
      label: AI agent used
      description: If the request is about agent behavior, which tool do you use?
      placeholder: OpenCode, Antigravity, Cursor, Claude Code, other
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or mockups
      description: Drag in anything that makes the idea clearer.
    validations:
      required: false
