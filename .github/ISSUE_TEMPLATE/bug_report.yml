name: Bug report
description: Report something that is broken
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more detail you share, the faster we can fix it.
  - type: input
    id: tool-used
    attributes:
      label: Tool used
      description: Which part of Frame-Relay were you using?
      placeholder: CLI, Figma plugin, MCP server, live mode, docs site
    validations:
      required: true
  - type: input
    id: ai-agent
    attributes:
      label: AI agent used
      description: Which AI coding tool were you using, if any?
      placeholder: OpenCode, Antigravity, Cursor, Claude Code, other, none
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug and include any error message exactly as it appeared.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the commands or clicks that lead to the bug.
      placeholder: |
        1. Run `npx @frame-relay/cli@beta sync`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Your Node version, Frame-Relay version and operating system.
      placeholder: Node 20.11, frame-relay 0.1.0-beta.0, macOS 15
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag in screenshots if they help explain the problem.
    validations:
      required: false
