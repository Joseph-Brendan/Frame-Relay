name: Deploy Schemas to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p site/schemas/v1
          cp -r packages/schema/json-schema/v1/* site/schemas/v1/
          cat << 'EOF' > site/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>Frame-Relay JSON Schemas</title>
              <style>
                body {
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                  max-width: 800px;
                  margin: 3rem auto;
                  padding: 0 1rem;
                  line-height: 1.6;
                  color: #1e293b;
                }
                h1 { color: #0f172a; }
                ul { list-style-type: none; padding: 0; }
                li { margin: 1rem 0; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; }
                a { color: #2563eb; text-decoration: none; font-weight: 600; }
                a:hover { text-decoration: underline; }
                code { background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
              </style>
            </head>
            <body>
              <h1>Frame-Relay JSON Schemas (v1)</h1>
              <p>Official schema definitions for the Frame-Relay design kit specification.</p>
              <ul>
                <li>
                  <a href="schemas/v1/manifest.schema.json">manifest.schema.json</a><br />
                  <span>Schema for <code>frame-relay.json</code> kit manifest.</span>
                </li>
                <li>
                  <a href="schemas/v1/tokens.schema.json">tokens.schema.json</a><br />
                  <span>Schema for DTCG <code>tokens.json</code> design tokens.</span>
                </li>
                <li>
                  <a href="schemas/v1/component.schema.json">component.schema.json</a><br />
                  <span>Schema for <code>components/&lt;Name&gt;.json</code> component specifications.</span>
                </li>
              </ul>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
