name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or newer (and Node 22.14 or newer).
      # The runner ships an older npm, so upgrade it before any publish step.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) on Node $(node --version)"

      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing starts only after the owner has published once by hand and connected
      # trusted publishing on npmjs.com, then set the NPM_PUBLISH_ENABLED repository variable.
      # See docs/dev/RELEASING.md.
      - name: Build packages for publishing
        if: steps.changesets.outputs.hasChangesets == 'false' && vars.NPM_PUBLISH_ENABLED == 'true'
        run: pnpm build

      - name: Publish to npm with trusted publishing
        if: steps.changesets.outputs.hasChangesets == 'false' && vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@josephbrendan/frame-relay@${VERSION}" version > /dev/null 2>&1; then
            echo "@josephbrendan/frame-relay@${VERSION} is already on npm. Nothing to publish."
            exit 0
          fi
          (cd packages/cli && npm publish --access public --tag beta --provenance)
          TAG="@josephbrendan/frame-relay@${VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
